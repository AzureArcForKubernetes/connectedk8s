name: ConnectedK8s CLI Testing

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/connectedk8s/**'
      - '.github/workflows/ConnectedK8sCLITesting.yml'
  workflow_dispatch:

permissions:
  contents: read
!  id-token: write

concurrency:
  group: connectedk8s-cli-testing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run ADO ConnectedK8s CLI tests
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: ado-ci

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@63c24ba6bd7ba022e95695ff85de572c04a18142 # v2.7.0
        with:
          egress-policy: audit

      - name: Validate ADO identity configuration
        env:
          ADO_CLIENT_ID: ${{ vars.ADO_CLIENT_ID }}
          ADO_TENANT_ID: ${{ vars.ADO_TENANT_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${ADO_CLIENT_ID}" || -z "${ADO_TENANT_ID}" ]]; then
            echo "::error::Configure ADO_CLIENT_ID and ADO_TENANT_ID in the ado-ci GitHub environment."
            exit 1
          fi

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ADO_CLIENT_ID }}
          tenant-id: ${{ vars.ADO_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Trigger ADO pipeline and wait for completion
        uses: azure/cli@v2
        env:
          ADO_ORGANIZATION: https://dev.azure.com/ClusterConfigurationAgent
          ADO_PROJECT: Extension CLI
          ADO_PIPELINE_ID: '643'
          COMMIT_ID: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          inlineScript: |
            set -euo pipefail

            az extension add \
              --name azure-devops \
              --only-show-errors \
              --yes

            echo "Queueing ADO pipeline ${ADO_PIPELINE_ID} for commit ${COMMIT_ID}."
            build_json="$(
              az pipelines build queue \
                --definition-id "${ADO_PIPELINE_ID}" \
                --organization "${ADO_ORGANIZATION}" \
                --project "${ADO_PROJECT}" \
                --variables "commit_id=${COMMIT_ID}" \
                --output json \
                --only-show-errors
            )"

            build_id="$(jq -er '.id' <<<"${build_json}")"
            build_url="$(jq -r '._links.web.href // empty' <<<"${build_json}")"

            echo "Queued ADO build ${build_id}."
            if [[ -n "${build_url}" ]]; then
              echo "Build URL: ${build_url}"
            fi

            while true; do
              build_json="$(
                az pipelines build show \
                  --id "${build_id}" \
                  --organization "${ADO_ORGANIZATION}" \
                  --project "${ADO_PROJECT}" \
                  --output json \
                  --only-show-errors
              )"

              status="$(jq -r '.status' <<<"${build_json}")"
              result="$(jq -r '.result // "pending"' <<<"${build_json}")"
              echo "ADO build ${build_id}: status=${status}, result=${result}"

              if [[ "${status}" == "completed" ]]; then
                if [[ "${result}" == "succeeded" ]]; then
                  exit 0
                fi

                echo "::error::ADO build ${build_id} completed with result ${result}."
                exit 1
              fi

              sleep 30
            done
